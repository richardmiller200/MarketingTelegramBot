<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kinetic Command — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" />
  <style>
/* Login — matching "Neon Observatory" design system */
:root {
  --surface:                  #0c0e11;
  --surface-container-lowest: #000000;
  --surface-container-low:    #111417;
  --surface-container:        #171a1d;
  --surface-container-high:   #1d2024;
  --surface-container-highest:#23262a;

  --primary:          #81ecff;
  --primary-dim:      #00d4ec;
  --on-primary-fixed: #003840;
  --tertiary:         #8eff71;
  --error:            #ff716c;

  --on-surface:         #f9f9fd;
  --on-surface-variant: #aaabaf;
  --outline-variant:    #46484b;

  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { background: var(--surface); }

body {
  margin: 0;
  font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--on-surface);
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}

.material-symbols-outlined {
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  vertical-align: middle;
}

/* Ambient backdrop */
.ambient {
  position: fixed; inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(900px 500px at 15% -10%,  rgba(0,212,236,0.12), transparent 60%),
    radial-gradient(700px 500px at 110% 10%,  rgba(142,255,113,0.07), transparent 55%),
    radial-gradient(700px 700px at 50% 120%,  rgba(129,236,255,0.06), transparent 60%);
}

.shell {
  position: relative;
  z-index: 1;
  width: min(440px, 94vw);
  padding: 34px 32px 28px;
  border-radius: 18px;
  background: rgba(23, 26, 29, 0.85);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
}

/* Brand block */
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.brand-icon {
  width: 44px; height: 44px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--on-primary-fixed);
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  box-shadow: 0 0 22px rgba(129, 236, 255, 0.28);
  flex-shrink: 0;
}
.brand-icon .material-symbols-outlined { font-size: 24px; }
.brand h1 {
  margin: 0;
  font-family: "Manrope", sans-serif;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -0.015em;
  color: var(--on-surface);
  line-height: 1;
}
.brand .eyebrow {
  margin: 0 0 4px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(129, 236, 255, 0.7);
}

/* Subtitle */
.sub {
  margin: 0 0 24px;
  font-size: 13px;
  color: var(--on-surface-variant);
  line-height: 1.5;
}

/* Form */
form { display: flex; flex-direction: column; gap: 14px; }

label {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
label span {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
}

input {
  width: 100%;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 14px;
  color: var(--on-surface);
  background: var(--surface-container-lowest);
  border: 1px solid rgba(70, 72, 75, 0.15);
  border-radius: 10px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input::placeholder { color: rgba(170, 171, 175, 0.6); }
input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(129, 236, 255, 0.15);
}

button {
  margin-top: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 13px;
  font-family: "Manrope", sans-serif;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--on-primary-fixed);
  background: linear-gradient(135deg, var(--primary), var(--primary-dim));
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: filter .15s, transform .1s;
}
button:hover { filter: brightness(1.08); }
button:active { transform: scale(0.98); }
button .material-symbols-outlined { font-size: 16px; }

/* Error block */
.err {
  margin-top: 8px;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--error);
  background: rgba(255, 113, 108, 0.08);
  border-radius: 8px;
  letter-spacing: 0;
  text-transform: none;
  font-weight: 500;
}

/* Footer */
.foot {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--on-surface-variant);
}
.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.dot-tertiary {
  background: var(--tertiary);
  filter: drop-shadow(0 0 6px rgba(142,255,113,0.55));
}

</style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <main class="shell">
    <div class="brand">
      <div class="brand-icon">
        <span class="material-symbols-outlined">rocket_launch</span>
      </div>
      <div>
        <p class="eyebrow">V2.4 · Active</p>
        <h1>Kinetic Command</h1>
      </div>
    </div>

    <p class="sub">Secure authentication required to access fleet controls.</p>

    <form method="POST" action="/login" autocomplete="off">
      <label>
        <span>Username</span>
        <input name="username" required autocomplete="username" />
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <button type="submit">
        <span class="material-symbols-outlined">login</span>
        Sign In
      </button>
      
    </form>

    <footer class="foot">
      <span class="dot dot-tertiary"></span>
      <span>All Systems Nominal</span>
    </footer>
  </main>
</body>
</html>
